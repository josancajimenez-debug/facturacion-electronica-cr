name: Desplegar en Supabase

# Se ejecuta en cada push a main que cambie la base de datos, la función Edge o el
# core (que la función incluye), y también a mano. Corre las pruebas antes de desplegar.
# Requiere en Settings > Secrets and variables > Actions:
#   Secrets:   SUPABASE_ACCESS_TOKEN (token personal de supabase.com) y SUPABASE_DB_PASSWORD
#   Variables: SUPABASE_PROJECT_REF (identificador del proyecto) y, opcional, ADMIN_EMAILS
#              (correos separados por coma que pueden limpiar los datos de otros usuarios o de todos)
on:
  push:
    branches: [main]
    paths:
      - supabase/**
      - packages/core/**
      - .github/workflows/supabase.yml
  workflow_dispatch:

# Un despliegue a la vez; uno nuevo espera al anterior en lugar de cortarlo a medias.
concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - run: supabase config push --project-ref "$SUPABASE_PROJECT_REF"
      # Secreto de la función Edge: sin él nadie tiene opciones de administrador.
      - if: ${{ vars.ADMIN_EMAILS != '' }}
        env:
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
        run: supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" "ADMIN_EMAILS=$ADMIN_EMAILS"
      # Empaquetado en el servidor de Supabase: respeta functions/api/deno.json y no depende de Docker.
      - run: supabase functions deploy api --use-api --project-ref "$SUPABASE_PROJECT_REF"
