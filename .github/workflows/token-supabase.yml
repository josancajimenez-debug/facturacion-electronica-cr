name: Revisar token de Supabase

# Cada lunes comprueba que el secreto SUPABASE_ACCESS_TOKEN siga vigente y tenga acceso al proyecto.
# Si venció o le faltan permisos, el flujo falla y GitHub envía un correo: así se renueva antes de que
# falle un despliegue. Pasos para renovarlo: supabase.com/dashboard/account/tokens → nuevo token →
# Settings > Secrets and variables > Actions > SUPABASE_ACCESS_TOKEN.
on:
  schedule:
    - cron: '0 13 * * 1' # lunes 7:00 a. m. en Costa Rica
  workflow_dispatch:

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar el proyecto con el token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN."
            exit 1
          fi
          codigo=$(curl -s -o respuesta.json -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF")
          if [ "$codigo" = "200" ]; then
            echo "Token vigente: acceso al proyecto $SUPABASE_PROJECT_REF confirmado."
          elif [ "$codigo" = "401" ]; then
            echo "::error::El token de Supabase venció o fue revocado. Genere uno nuevo y actualice el secreto SUPABASE_ACCESS_TOKEN."
            exit 1
          elif [ "$codigo" = "403" ]; then
            echo "::error::El token de Supabase no tiene permisos sobre el proyecto: $(cat respuesta.json)"
            exit 1
          else
            echo "::error::Supabase respondió $codigo al revisar el token: $(cat respuesta.json)"
            exit 1
          fi
